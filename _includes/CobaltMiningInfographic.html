<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">

<style>
.cobalt-vis {
    position: relative;
    width: 100%;
    padding-bottom: 56.8%; /* matches 1786 x 1014 aspect ratio of background image */
    font-family: 'Staatliches', sans-serif;
    overflow: hidden;
    cursor: pointer;
}
.cobalt-vis .cobalt-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}
.cobalt-vis .cobalt-title-container {
    position: absolute;
    top: 5%;
    left: 10%;
    width: 75%;
    text-align: left;
    z-index: 1;
}
.cobalt-vis .cobalt-title {
    font-size: 32px;
    color: #8B4513;
}
.cobalt-vis .cobalt-subtitle {
    font-size: 18px;
    color: #8B4513;
    font-style: italic;
    margin-top: 5px;
}
.cobalt-vis svg {
    position: absolute;
    top: 20%;
    left: 10%;
    width: 75%;
    height: 70%;
}
.cobalt-vis .bar {
    fill: green;
    opacity: 0.5;
    cursor: pointer;
}
.cobalt-vis .axis text {
    fill: #FDF5CA;
    font-size: 18px;
    font-family: 'Staatliches', sans-serif;
}
.cobalt-vis .bar-label {
    fill: #FDF5CA;
    font-family: 'Staatliches', sans-serif;
    font-size: 16px;
}
</style>

<div class="cobalt-vis">
    <img class="cobalt-background" src="{{ site.baseurl }}/assets/img/CobaltMiningBackground.png" alt="AI-generated illustration of cobalt mining in the Congo">
    <div class="cobalt-title-container">
        <div class="cobalt-title">Daily Wages (USD) of Cobalt Miners in Congo</div>
        <div class="cobalt-subtitle">click bars for details</div>
    </div>
    <svg></svg>
</div>

<script>
(function() {
    const data = [
        { category: '0-4', percentage: 40 },
        { category: '4-10', percentage: 28 },
        { category: '10-15', percentage: 11 },
        { category: '15-20', percentage: 12 },
        { category: '20-50', percentage: 9 }
    ];

    const tableauDashboardURL = 'https://public.tableau.com/app/profile/kristin.henderson/viz/miningDashboard/MiningDashboard';

    const svg = d3.select(".cobalt-vis svg");
    const margin = { top: 60, right: 20, bottom: 30, left: 60 };

    // Draw the chart at the SVG's current rendered size.
    // Called on first load and on window resize so the chart fits the container.
    function build() {
        svg.selectAll("*").remove();

        const svgWidth = svg.node().clientWidth;
        const svgHeight = svg.node().clientHeight;
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleBand()
            .domain(data.map(d => d.category))
            .rangeRound([0, width])
            .padding(0.4);

        const y = d3.scaleLinear()
            .domain([0, d3.max(data, d => d.percentage)]).nice()
            .rangeRound([height, 0]);

        g.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x).tickSize(0).tickPadding(10))
            .selectAll("text")
            .style("fill", "none");

        g.append("g")
            .attr("class", "axis axis--y")
            .call(d3.axisLeft(y).ticks(10).tickSize(-width).tickFormat(d => d + "%"));

        g.selectAll(".bar")
            .data(data)
            .enter().append("rect")
            .attr("class", "bar")
            .attr("x", d => x(d.category))
            .attr("y", d => y(d.percentage))
            .attr("width", x.bandwidth())
            .attr("height", d => height - y(d.percentage))
            .on("click", () => window.open(tableauDashboardURL, '_blank'));

        g.selectAll(".bar-label")
            .data(data)
            .enter().append("text")
            .attr("class", "bar-label")
            .attr("x", d => x(d.category) + x.bandwidth() / 2)
            .attr("y", d => y(d.percentage) + 20)
            .attr("text-anchor", "middle")
            .text(d => `${d.category}`);

        g.append("text")
            .attr("class", "bar-label")
            .attr("x", x(data[0].category) + x.bandwidth() / 2)
            .attr("y", y(data[0].percentage) + 40)
            .attr("text-anchor", "middle")
            .text("below minimum wage");
    }

    d3.select(".cobalt-vis .cobalt-background")
        .on("click", () => window.open(tableauDashboardURL, '_blank'));

    build();
    window.addEventListener("resize", build);

    // Citations
    // 1. BGR. (2019). Cobalt from the Congo – how to source it better. https://www.delvedatabase.org/uploads/resources/BGR_Cobalt_Congo_2019_en.pdf
    // 2. Lithium News. Artisanal miners could help Congo become world's fourth-largest cobalt producer. https://lithium-news.com/artisanal-miners-could-help-congo-become-worlds-fourth-largest-cobalt-producer/
    // 3. LifeGate. Cobalt mining in Congo: tech companies face a lawsuit. https://www.lifegate.com/cobalt-mining-congo-tech-lawsuit
    // 4. OpenAI. (2024). ChatGPT. https://chat.openai.com
})();
</script>
